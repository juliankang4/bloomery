[package]
name = "bloomery-tokenizer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "tokenizer"

[[bin]]
name = "bloomery-tokenize"
path = "src/bin/bloomery-tokenize.rs"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
# Special-token partition scans the whole text once per special token, as the
# reference does; memmem keeps that scan at memory speed.
memchr = "=2.8.3"
thiserror.workspace = true
# Hugging Face's tokenizers normalizes with this crate, whose tables are Unicode 9.0's; NFC runs
# only for a header that declares it (an imported tokenizer.json), so its codepoints are HF's.
unicode-normalization-alignments = "=0.1.12"

[dev-dependencies]
# The oracle sets the tests compare with open through their refset family.
bloomery-refset = { path = "../refset" }
