[package]
name = "bloomery-gpu-gemma-embedding2"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lints]
workspace = true

# The EmbeddingGemma 2 encoder: host code only, no `#[cuda_module]` of its own. It composes the
# kernels of `bloomery-gpu` (the q8_0 GEMM, the f32 tile, the norms, the GELU GLU, the whole-turn
# rope-and-append at heads 256 and 512, the bidirectional prefill flashes); it is built with
# `cargo oxide` because that crate is.
[dependencies]
cuda-core.workspace = true
bloomery-gpu = { path = "../gpu" }
# Host only: the header read and the token rows.
bloomery-gguf = { path = "../gguf" }
bloomery-model = { path = "../model" }
