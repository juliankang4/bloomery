[package]
name = "bloomery-safetensors"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Memory-mapped safetensors files and sharded folders, borrowed raw tensors and explicit float conversion"

[lib]
name = "safetensors"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
memmap2.workspace = true
serde = "=1.0.229"
serde_json = "=1.0.151"
thiserror = { workspace = true }

[dev-dependencies]
# The shared checkpoint headers in ../hf/tests/fixtures are kept gzipped.
flate2 = "1.1.10"
